<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="main.js" defer></script>
    <title>Helpdesk</title>
</head>
<body>
    <form class="helpdeskForm">
        <label for="helpdeskTitle">Nazwij pozycję: </label>
        <input type="text" id="helpdeskTitle" class="helpdeskTitle" name="helpdeskTitle">
        <label for="helpdeskPriority">Wybierz Priorytet: </label>
        <select id="helpdeskPriority" name="helpdeskPriority" class="helpdeskPriority">
            <option value="low">Niski</option>
            <option value="medium">Średni</option>
            <option value="high">Wysoki</option>
        </select>
        <button type="submit">Dodaj</button>
    </form>

    <select class="helpdeskFilter">
        <option value="all">Wszystkie</option>
        <option value="new">Nowe</option>
        <option value="doing">W trakcie</option>
        <option value="done">Zrobione</option>
    </select>
    <ul class="helpdeskList">

    </ul>
</body>
</html>
