<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="./main.js"></script>
    <title>Helpdesk</title>
</head>
<body>
    <form class="helpdeskForm">
        <label for="helpdeskTitle">Name your ticket: </label>
        <input type="text" id="helpdeskTitle" class="helpdeskTitle" name="helpdeskTitle">
        <label for="helpdeskPriority">Choose priority: </label>
        <select id="helpdeskPriority" name="helpdeskPriority" class="helpdeskPriority">
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
        </select>
        <button type="submit">add</button>
    </form>

    <select class="helpdeskFilter">
        <option value="all">all</option>
        <option value="new">new</option>
        <option value="doing">doing</option>
        <option value="done">done</option>
    </select>
    <ul class="helpdeskList">

    </ul>
</body>
</html>
